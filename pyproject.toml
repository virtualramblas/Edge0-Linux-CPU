[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge0"
version = "0.1.0"
description = "edge0 Linux CPU reference backend"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.4", "numpy>=1.24", "safetensors>=0.4", "tokenizers>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edge0 = "edge0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
